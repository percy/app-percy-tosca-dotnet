name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      branch:
        description: '@percy/cli branch to test against'
        required: false
        default: master

jobs:
  core:
    # AppPercyTosca.sln is deliberately not built here: it references the Tricentis assemblies, which
    # only exist on a machine with Tosca Testsuite installed. The shim's *sources* are still compiled,
    # by AppPercyTosca.ShimCheck (part of the Core solution) against stubs for those types — see that
    # project's csproj for what that does and does not prove.
    name: Core unit tests + 100% line coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore AppPercyTosca.Core.sln

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions-ecosystem/action-regex-match@v2
        id: regex-match
        if: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          text: ${{ github.event.inputs.branch }}
          regex: '^[a-zA-Z0-9_/\-]+$'
      - name: Break on invalid branch name
        if: ${{ github.event_name == 'workflow_dispatch' && steps.regex-match.outputs && steps.regex-match.outputs.match == '' }}
        run: exit 1
      - name: Set up @percy/cli from git
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          BRANCH: ${{ github.event.inputs.branch }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          cd /tmp
          git clone --branch "$BRANCH" --depth 1 https://github.com/percy/cli
          cd cli
          yarn
          yarn build
          yarn global:link
          echo "$(yarn global bin)" >> "$GITHUB_PATH"
          export PATH="$(yarn global bin):$PATH"
          percy --version

      - name: Test with 100% line coverage gate
        run: >
          dotnet test AppPercyTosca.Core.sln
          --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:Include="[AppPercyTosca.Core]*"
          /p:ThresholdType=line
          /p:Threshold=100
