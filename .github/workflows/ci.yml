name: CI

# No `@percy/cli branch` input, and no Node in the job.
#
# There used to be both, copied from the other Percy SDKs, which run their suites against a CLI they
# link from source. This suite does not: every test injects a stub HttpMessageHandler and no test
# opens a socket, so a linked CLI could not change a single result. Installing one described a
# guarantee the job was not providing. If an integration test that drives a real CLI is ever added,
# bring the input and the setup steps back with it.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    # AppPercyTosca.sln is deliberately not built here: it references the Tricentis assemblies, which
    # only exist on a machine with Tosca Testsuite installed. The shim's *sources* are still compiled,
    # by AppPercyTosca.ShimCheck (part of the Core solution) against stubs for those types — see that
    # project's csproj for what that does and does not prove.
    name: Core unit tests + 100% line coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore AppPercyTosca.Core.sln

      - name: Test with 100% line coverage gate
        run: >
          dotnet test AppPercyTosca.Core.sln
          --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:Include="[AppPercyTosca.Core]*"
          /p:ThresholdType=line
          /p:Threshold=100
